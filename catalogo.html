        /* Tarjetas de promoción destacadas */
        .product-card.promo-card {

        /* ============================================================
           CAMPAÑA PROMOCIÓN DE LA SEMANA — 1 de agosto
           Animaciones sólo con transform/opacity (compuestas por GPU)
           para no penalizar el rendimiento de la página.
           ============================================================ */

        /* --- Banner que encabeza los 7 destacados --- */
        .semana-banner {
            grid-column: 1 / -1;
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            padding: 1.05rem 1.3rem;
            background: linear-gradient(120deg, #3A0815 0%, #5B0E22 42%, #7D1B36 68%, #4A0B1C 100%);
            color: #fff;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.9rem;
            box-shadow: 0 10px 30px rgba(91, 14, 34, 0.3);
            border: 2px solid rgba(255, 215, 128, 0.55);
            contain: paint;
        }
        .semana-banner::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translate3d(-160%, 0, 0) skewX(-18deg);
            animation: semanaSheen 5.5s ease-in-out infinite;
            pointer-events: none;
            will-change: transform;
        }
        @keyframes semanaSheen {
            0%   { transform: translate3d(-160%, 0, 0) skewX(-18deg); }
            55%, 100% { transform: translate3d(330%, 0, 0) skewX(-18deg); }
        }
        .semana-banner-text { position: relative; z-index: 2; min-width: 240px; }
        .semana-banner-text h2 {
            font-family: 'Bodoni Moda', Georgia, serif;
            font-size: 1.45rem;
            line-height: 1.15;
            margin: 0 0 0.25rem;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
        }
        .semana-banner-text p {
            margin: 0;
            font-family: 'Jost', sans-serif;
            font-size: 0.86rem;
            opacity: 0.94;
            letter-spacing: 0.2px;
        }
        .semana-banner .semana-gold { color: #ffd88a; }
        .semana-crown {
            display: inline-block;
            margin-right: 6px;
            animation: semanaTwinkle 2.4s ease-in-out infinite;
        }
        @keyframes semanaTwinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50%      { transform: scale(1.25) rotate(12deg); opacity: 0.75; }
        }

        .filter-btn.semana-filter {

        @media (max-width: 640px) {
            .semana-banner { padding: 0.9rem 1rem; justify-content: center; text-align: center; }
            .semana-banner-text { min-width: 0; }
            .semana-banner-text h2 { font-size: 1.15rem; }

            .semana-ribbon { font-size: 0.62rem; padding: 0.35rem 0.75rem 0.35rem 0.95rem; }
        }

        /* Respeta la preferencia de menos movimiento del sistema */
        @media (prefers-reduced-motion: reduce) {
            .semana-banner::after,
            .semana-crown,
            .semana-ribbon,
            .semana-ribbon .semana-spark,
            .semana-savings { animation: none !important; }

        .ff-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(42, 10, 18, 0.55);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .ff-overlay.ff-show { opacity: 1; }
        .ff-card {
            position: relative;
            width: min(560px, 100%);
            max-height: calc(100vh - 32px);
            overflow: auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            transform: translateY(18px) scale(0.97);
            transition: transform 0.35s ease;
            font-family: 'Jost', sans-serif;
        }
        .ff-overlay.ff-show .ff-card { transform: none; }
        .ff-head {
            background: linear-gradient(120deg, #2A0A12 0%, #5B0E22 50%, #6B2A3A 100%);
            color: #fff;
            text-align: center;
            padding: 1.1rem 2.6rem 0.95rem;
        }
        .ff-kicker {
            display: inline-block;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e3dce8;
            border: 1px solid rgba(227, 220, 232, 0.55);
            border-radius: 50px;
            padding: 0.2rem 0.75rem;
            margin-bottom: 0.45rem;
        }
        .ff-head h3 {
            font-family: 'Bodoni Moda', Georgia, serif;
            font-size: 1.5rem;
            line-height: 1.15;
            margin: 0 0 0.2rem;
            color: #fff;

        .ff-head p { margin: 0; font-size: 0.82rem; opacity: 0.9; }
        .ff-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            z-index: 2;
        }
        .ff-close:hover { background: rgba(255, 255, 255, 0.3); }
        .ff-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            padding: 1rem;
        }
        .ff-item {
            position: relative;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #5B0E22;
            border: 1px solid #ebe6ee;
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .ff-item:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(91, 14, 34, 0.15); }
        .ff-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #f5f3f6;
        }
        .ff-off {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #5B0E22;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.15rem 0.45rem;
            border-radius: 50px;
        }
        .ff-info { padding: 0.5rem 0.55rem 0.6rem; text-align: center; }
        .ff-name {
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.25;
            margin: 0 0 0.3rem;
            min-height: 2.5em;
        }
        .ff-old { display: block; font-size: 0.74rem; color: #999; text-decoration: line-through; }
        .ff-new { display: block; font-size: 1.02rem; font-weight: 800; color: #5B0E22; }
        .ff-foot { padding: 0 1rem 1rem; text-align: center; }
        .ff-cta {
            display: inline-block;
            background: linear-gradient(135deg, #5B0E22 0%, #C9A24D 100%);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 0.65rem 1.5rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }
        .ff-progress { height: 4px; background: #ebe6ee; }
        .ff-progress span {
            display: block;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #C9A24D, #5B0E22);
            transform-origin: left center;
        }
        .ff-overlay.ff-run .ff-progress span { animation: ffCountdown 5s linear forwards; }
        @keyframes ffCountdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

        @media (max-width: 480px) {
            .funebre-banner { padding: 0.9rem 1rem; justify-content: center; text-align: center; }

            .ff-name { font-size: 0.64rem; }
            .ff-new { font-size: 0.88rem; }
            .ff-old { font-size: 0.66rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .funebre-banner::after { animation: none !important; }

/* ============================================================
   PROMOCIÓN DE LA SEMANA
   Contador semanal (cierra cada domingo a las 23:59) y banner
   de sección. Todo el movimiento se hace con transform/opacity,
   así el navegador lo resuelve en la GPU y no re-calcula el layout.
   ============================================================ */
var semanaCdTimer = null;

/* La promo cierra el domingo de la semana en curso a las 23:59:59
   (hora local del visitante). Se recalcula sola: el lunes parte de nuevo,
   así que no hay que editar fechas cada semana. */
function semanaDeadline() {
    var now = new Date();
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
    var dow = now.getDay(); // 0 = domingo
    end.setDate(end.getDate() + (dow === 0 ? 0 : 7 - dow));
    return end.getTime();
}

function semanaTimeLeft() {
    var diff = semanaDeadline() - Date.now();
    if (diff <= 0) return null;
    return {
        d: Math.floor(diff / 86400000),
        h: Math.floor(diff / 3600000) % 24,
        m: Math.floor(diff / 60000) % 60,
        s: Math.floor(diff / 1000) % 60
    };
}

function semanaCountdownHTML(compact) {
    var labels = { d: 'días', h: 'hrs', m: 'min', s: 'seg' };
    var units = ['d', 'h', 'm', 's'].map(function (u) {
        return '<div class="semana-cd-unit"><span class="semana-cd-num" data-cd="' + u + '">--</span>' +
               '<span class="semana-cd-lbl">' + labels[u] + '</span></div>';
    }).join('');
    return '<div class="semana-countdown' + (compact ? ' semana-cd-compact' : '') + '" data-semana-cd>' + units + '</div>';
}

function startSemanaCountdown() {
    if (semanaCdTimer) { clearInterval(semanaCdTimer); semanaCdTimer = null; }
    function tick() {
        var t = semanaTimeLeft();
        var boxes = document.querySelectorAll('[data-semana-cd]');
        if (!boxes.length) return;
        for (var i = 0; i < boxes.length; i++) {
            if (!t) { boxes[i].innerHTML = '<div class="semana-cd-unit"><span class="semana-cd-num">¡HOY!</span><span class="semana-cd-lbl">último día</span></div>'; continue; }
            var nums = boxes[i].querySelectorAll('[data-cd]');
            for (var j = 0; j < nums.length; j++) {
                var v = t[nums[j].getAttribute('data-cd')];
                var txt = v < 10 ? '0' + v : '' + v;
                if (nums[j].textContent !== txt) nums[j].textContent = txt;
            }
        }
    }
    tick();
    semanaCdTimer = setInterval(tick, 1000);
}

function semanaBannerHTML(count) {
    return '<div class="semana-banner">' +
             '<div class="semana-banner-text">' +
               '<h2><span class="semana-crown">✦</span>Promoción de la <span class="semana-gold">Semana</span></h2>' +
               '<p>' + count + ' arreglos escogidos con hasta <strong>22% de descuento</strong> · Vigente hasta el domingo</p>' +
             '</div>' +
             semanaCountdownHTML(false) +
           '</div>';
}

function semanaCardOverlay(product) {
    if (!product.semana) return '';
    var badge = '';
    if (product.originalPrice && product.originalPrice > product.price) {
        var off = Math.round((1 - product.price / product.originalPrice) * 100);
        badge = '<div class="semana-savings">-' + off + '%<small>DCTO</small></div>';
    }
    return '<div class="semana-ribbon"><span class="semana-spark">✦</span> PROMO DE LA SEMANA <span class="semana-spark">✦</span></div>' + badge;
}

/* ============================================================
   PROMOCIÓN ARREGLOS FÚNEBRES
   Los productos con funebrePromo: true se muestran justo debajo
   de la Promoción de la Semana, con su propio banner, y en un
   flyer flotante que se cierra solo a los 5 segundos.
   ============================================================ */
function funebreBannerHTML(list) {
    var maxOff = 0;
    list.forEach(function (p) {
        if (p.originalPrice > p.price) maxOff = Math.max(maxOff, Math.round((1 - p.price / p.originalPrice) * 100));
    });
    return '<div class="funebre-banner" id="promo-funebre">' +
             '<div class="funebre-banner-text">' +
               '<h2>Promoción <span class="funebre-silver">Arreglos Fúnebres</span></h2>' +
               '<p>Acompaña tus condolencias con un tributo floral entregado a domicilio en Santiago</p>' +
             '</div>' +
             '<div class="funebre-banner-tag">Hasta ' + maxOff + '% de descuento</div>' +
           '</div>';
}

function funebreCardOverlay(product) {
    if (!product.funebrePromo || product.semana) return '';
    var badge = '';
    if (product.originalPrice && product.originalPrice > product.price) {
        var off = Math.round((1 - product.price / product.originalPrice) * 100);
        badge = '<div class="funebre-savings">-' + off + '%<small>DCTO</small></div>';
    }
    return '<div class="funebre-ribbon"><span>❀</span> PROMO FÚNEBRE <span>❀</span></div>' + badge;
}

function showFunebreFlyer() {
    var list = products.filter(function (p) { return p.funebrePromo; });
    if (!list.length || document.getElementById('ff-overlay')) return;
    var fmt = function (n) { return '$' + n.toLocaleString('es-CL'); };
    var items = list.map(function (p) {
        var off = p.originalPrice ? Math.round((1 - p.price / p.originalPrice) * 100) : 0;
        var wa = 'https://wa.me/56949170969?text=' + encodeURIComponent('Hola, me interesa el producto ' + p.code + ': ' + p.name + ' - ' + fmt(p.price) + ' (promoción arreglos fúnebres)');
        return '<a class="ff-item" href="' + wa + '" target="_blank" rel="noopener" onclick="gtag_report_conversion();">' +
                 (off ? '<span class="ff-off">-' + off + '%</span>' : '') +
                 '<img src="' + p.image + '" alt="' + p.name + '">' +
                 '<div class="ff-info">' +
                   '<p class="ff-name">' + p.name + '</p>' +
                   (p.originalPrice ? '<span class="ff-old">Antes ' + fmt(p.originalPrice) + '</span>' : '') +
                   '<span class="ff-new">' + fmt(p.price) + '</span>' +
                 '</div>' +
               '</a>';
    }).join('');

    var overlay = document.createElement('div');
    overlay.className = 'ff-overlay';
    overlay.id = 'ff-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'Promoción de arreglos fúnebres');
    overlay.innerHTML =
        '<div class="ff-card">' +
          '<button class="ff-close" type="button" aria-label="Cerrar">&times;</button>' +
          '<div class="ff-head">' +
            '<span class="ff-kicker">Promoción especial</span>' +
            '<h3>Arreglos Fúnebres</h3>' +
            '<p>Envía tu cariño y respeto en el momento de la despedida</p>' +
          '</div>' +
          '<div class="ff-progress"><span></span></div>' +
          '<div class="ff-items">' + items + '</div>' +
          '<div class="ff-foot"><button class="ff-cta" type="button">Ver promoción</button></div>' +
        '</div>';
    document.body.appendChild(overlay);

    var timer = null;
    function close() {
        if (!overlay.parentNode) return;
        clearTimeout(timer);
        overlay.classList.remove('ff-show');
        document.removeEventListener('keydown', onKey);
        setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 380);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }

    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    overlay.querySelector('.ff-close').addEventListener('click', close);
    overlay.querySelector('.ff-cta').addEventListener('click', function () {
        close();
        var target = document.getElementById('promo-funebre');
        if (!target) {
            document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.filter === 'todos'); });
            renderProducts('todos', '');
            target = document.getElementById('promo-funebre');
        }
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.addEventListener('keydown', onKey);

    requestAnimationFrame(function () {
        requestAnimationFrame(function () { overlay.classList.add('ff-show', 'ff-run'); });
    });
    timer = setTimeout(close, 5000); // se cierra solo a los 5 segundos
}

                    const text = normalize(
                        product.code + ' ' +
                        product.name + ' ' +
                        product.description + ' ' +
                        product.categories.join(' ')
                    );
                    return searchWords.every(word => text.includes(word));
                });

            if (filteredProducts.length === 0) {
                grid.style.display = 'none';
                emptyState.classList.add('active');

                    ` : ''}
                    <div class="product-image-container ${hasVariations ? 'has-carousel' : ''}" data-code="${product.code}" onclick="${lightboxHandler}">
                        ${imagesHtml}

        // Carousel para productos con variaciones
        let carouselTimers = [];
        function initCarousels() {
            carouselTimers.forEach(t => clearInterval(t));
            carouselTimers = [];
            document.querySelectorAll('.product-image-container.has-carousel').forEach(carousel => {
                const imgs = carousel.querySelectorAll('.carousel-img');
                const dots = carousel.querySelectorAll('.carousel-dot');
                const counter = carousel.querySelector('.carousel-current');
                if (imgs.length <= 1) return;
                let current = 0;
                const setActive = (idx) => {
                    imgs[current].classList.remove('active');
                    if (dots[current]) dots[current].classList.remove('active');
                    current = (idx + imgs.length) % imgs.length;
                    imgs[current].classList.add('active');
                    if (dots[current]) dots[current].classList.add('active');
                    if (counter) counter.textContent = current + 1;
                };
                const timer = setInterval(() => setActive(current + 1), 3000);
                carouselTimers.push(timer);
                dots.forEach((dot, i) => {
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setActive(i);
                    });
                });
            });
        }

        function openCarouselLightbox(code, name, price) {
            const card = document.querySelector(`.product-image-container.has-carousel[data-code="${code}"]`);
            if (!card) return;
            const activeImg = card.querySelector('.carousel-img.active') || card.querySelector('.carousel-img');
            if (activeImg) openLightbox(activeImg.src, name, price);
        }

        function formatPrice(price) {
            if (price === 0) return 'Cotización';
            return '$' + price.toLocaleString('es-CL');
        }

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderProducts(this.dataset.filter);
                window.scrollTo({ top: 400, behavior: 'smooth' });
            });
        });

        // Búsqueda
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        let searchTimeout;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const val = this.value;
            searchClear.classList.toggle('visible', val.length > 0);
            searchTimeout = setTimeout(() => {
                renderProducts(undefined, val);
            }, 250);
        });
        searchClear.addEventListener('click', function() {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            renderProducts(undefined, '');
            searchInput.focus();
        });

        // Lightbox
        function openLightbox(image, name, price) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-image').src = image;
            document.getElementById('lightbox-image').alt = name;
            document.getElementById('lightbox-title').textContent = name;
            document.getElementById('lightbox-price').textContent = price;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        // Scroll to top
        const scrollTop = document.getElementById('scroll-top');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 500) scrollTop.classList.add('visible');
            else scrollTop.classList.remove('visible');
        });
        scrollTop.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Inicializar
        renderProducts();

        // Flyer flotante Promoción Arreglos Fúnebres (se cierra solo a los 5 s)
        window.addEventListener('load', function () { setTimeout(showFunebreFlyer, 700); });
